<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockudoku RL</title>
  <meta name="description" content="Play Blockudoku against a Rainbow DQN agent running locally in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 9'><rect width='4' height='4' fill='%234f6bed'/><rect x='5' y='5' width='4' height='4' fill='%234f6bed'/><rect x='5' width='4' height='4' fill='%23c6cff8'/><rect y='5' width='4' height='4' fill='%23c6cff8'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Blockudoku <span class="accent">RL</span></h1>
      <p class="sub">Rainbow DQN trained in JAX, running locally in your browser with onnxruntime-web.</p>
    </header>

    <section class="stats" aria-live="polite">
      <div><span class="label">Score</span><span id="score" class="value">0</span></div>
      <div><span class="label">Moves</span><span id="moves" class="value">0</span></div>
      <div><span class="label">Best</span><span id="best" class="value">0</span></div>
    </section>

    <div id="board" class="board" role="grid" aria-label="Board"></div>
    <div id="tray" class="tray" aria-label="Pieces"></div>

    <section class="controls">
      <button id="new-game" title="New game (N)">New game</button>
      <button id="hint" class="needs-model" title="Show the agent's move (H)">Hint</button>
      <button id="ai-move" class="needs-model" title="Let the agent play one move (A)">AI move</button>
      <button id="autoplay" class="needs-model primary" title="Agent plays continuously (Space)" aria-pressed="false">Autoplay</button>
    </section>
    <section class="controls secondary">
      <label>Speed <input id="speed" type="range" min="0" max="1000" step="50" value="300"></label>
      <label class="needs-model" title="Green = the agent's Q-value for placing the highlighted piece there"><input id="heatmap" type="checkbox" autocomplete="off"> Q-value heatmap</label>
    </section>

    <p id="status" class="status">Loading model…</p>
    <div id="overlay" class="overlay" hidden>
      <div class="card">
        <h2>Game over</h2>
        <p>Score <strong id="final-score">0</strong></p>
        <button id="again" class="primary">Play again</button>
      </div>
    </div>

    <footer>
      Tap a piece, then tap the board. Keys: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> select,
      <kbd>H</kbd> hint, <kbd>A</kbd> AI move, <kbd>Space</kbd> autoplay, <kbd>N</kbd> new game.
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
