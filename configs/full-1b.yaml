# 1B env steps: full.yaml scaled up in length. Submit with
# scripts/metacentrum/train_blackwell.pbs (or CONFIG=full-1b on any >= 32 GB GPU).
# Training cannot resume, so the run must fit one job; `--time-limit-hours`
# stops it cleanly (final eval + checkpoint) if the GPU is too slow for 1B steps.
extends: full.yaml

total_env_steps: 1000000000  # PER beta also anneals to 1.0 over this horizon

buffer_steps: 65536         # 33.5M transitions, ~3.6 GB on device
learning_starts: 2000000

iterations_per_log: 1000    # ~512k env steps per log line (~2k lines per run)
eval_every_logs: 10         # eval every ~5M env steps

wandb:
  tags: [rainbow, vit, 1b]
