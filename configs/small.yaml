# CPU-sized run (tens of minutes on a laptop). For real training use full.yaml on a GPU.
extends: full.yaml

num_envs: 32
total_env_steps: 1000000
buffer_steps: 4096
learning_starts: 20000
batch_size: 128
updates_per_iteration: 1
learning_rate: 3.0e-4
lr_warmup_updates: 1000
target_update_period: 1000
compute_dtype: float32
iterations_per_log: 250
eval_episodes: 64
eval_max_moves: 5000

net:
  dim: 64
  depth: 2
  heads: 2
  num_registers: 2
  adv_hidden: 64
  value_hidden: 128
  num_atoms: 51

wandb:
  enabled: false
