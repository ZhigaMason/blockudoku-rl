[project]
name = "blockudoku-rl"
version = "0.1.0"
description = "Rainbow DQN agent for Blockudoku in JAX/Equinox, deployed to the browser via transformers.js"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11.5",
    "optax>=0.2.3",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.30"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
wandb = ["wandb>=0.18", "python-dotenv>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8", "onnx>=1.16", "onnxruntime>=1.18", "ruff>=0.5",
    "wandb>=0.18", "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blockudoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
